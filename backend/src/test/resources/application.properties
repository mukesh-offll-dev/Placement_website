# Test Configuration with H2 in-memory DB in PostgreSQL mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
server.servlet.context-path=/api

# JWT Configuration
app.jwt.secret=${JWT_SECRET:ZGVmYXVsdC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LW5vdC1mb3ItcHJvZHVjdGlvbi11c2U=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Admin Bootstrap Configuration
app.admin.default-email=${DEFAULT_ADMIN_EMAIL:admin@gces.edu}
app.admin.default-password=${DEFAULT_ADMIN_PASSWORD:Admin@1234}
app.admin.default-name=${DEFAULT_ADMIN_NAME:Placement Officer}
