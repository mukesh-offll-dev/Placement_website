# Test environment properties using in-memory H2 database in PostgreSQL mode
spring.datasource.url=jdbc:h2:mem:placementcell_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable schema.sql for tests since create-drop generates tables from entity mappings
spring.sql.init.mode=never

server.servlet.context-path=/api

# Disable DataInitializer during tests (prevents failure when UserRepository is mocked)
app.data-init.enabled=false
