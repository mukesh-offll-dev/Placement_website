# ============================================================
# Application Configuration — Placement Cell Backend
# ============================================================
spring.application.name=placement-cell

# ============================================================
# Database Configuration — Neon PostgreSQL
# Loaded from .env
# ============================================================
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:h2:mem:placementcelldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA & Hibernate Settings
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# ============================================================
# SQL Schema Initialization
# ============================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ============================================================
# Server Configuration
# ============================================================
server.port=8080
server.servlet.context-path=/api

# ============================================================
# Multipart File Upload Configuration
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ============================================================
# File Upload Configuration
# ============================================================
file.upload-dir=./uploads
file.resume-subdir=resumes
file.project-media-subdir=projects
file.max-resume-size=10485760
file.max-media-size=10485760

# ============================================================
# Actuator Endpoints
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================================
# Jackson JSON Settings
# ============================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=${JWT_SECRET:PlacementCellSecretKeyForJWTSigning12345678901234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# Logging Configuration
# ============================================================
logging.level.com.gces.placementcell=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
