# ============================================================
# Application Configuration — Placement Cell Backend
# ============================================================
spring.application.name=placement-cell
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ============================================================
# Database Configuration — PostgreSQL / In-Memory H2 Dev Fallback
# In production, DB_URL/DATABASE_URL, DB_USERNAME, DB_PASSWORD are set via environment.
# ============================================================
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:h2:file:./data/placementcelldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE}}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:}

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:600000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}

# ============================================================
# JPA & Hibernate Settings
# ============================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}

# ============================================================
# SQL Schema Initialization
# ============================================================
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql

# ============================================================
# Server Configuration
# ============================================================
# Hosts such as Render inject PORT; 8080 locally.
server.port=${PORT:8080}
server.servlet.context-path=/api

# ============================================================
# CORS Configuration
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================================
# Multipart File Upload Configuration
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${FILE_MAX_UPLOAD_SIZE:15MB}
spring.servlet.multipart.max-request-size=${FILE_MAX_REQUEST_SIZE:20MB}

# ============================================================
# File Storage Configuration
# ============================================================
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
# Where uploads live: "local" (the upload-dir above) or "cloudinary" (needs CLOUDINARY_URL).
file.storage=${FILE_STORAGE:local}
cloudinary.url=${CLOUDINARY_URL:}
file.resume-subdir=${FILE_RESUME_SUBDIR:resumes}
file.project-media-subdir=${FILE_PROJECT_MEDIA_SUBDIR:projects}
file.max-resume-size=${FILE_MAX_RESUME_SIZE:10485760}
file.max-media-size=${FILE_MAX_MEDIA_SIZE:10485760}

# ============================================================
# Actuator Endpoints
# ============================================================
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}

# ============================================================
# Jackson JSON Settings
# ============================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================================
# JWT Security Configuration
# Loaded from environment variables (JWT_SECRET, JWT_EXPIRATION_MS, JWT_REFRESH_EXPIRATION_MS)
# ============================================================
# --- Email goes through EmailJS only (no SMTP). Off until EMAILJS_* are supplied via backend/.env.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.emailjs.service-id=${EMAILJS_SERVICE_ID:}
app.emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
app.emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
app.emailjs.private-key=${EMAILJS_PRIVATE_KEY:}
# Email students about their own applications (submitted, status, interview stage). Set false when the
# frontend sends these through EmailJS so each event is mailed once. Admin and job alerts are unaffected.
app.mail.student-application-emails=${APP_MAIL_STUDENT_APPLICATION_EMAILS:true}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# --- Student accounts: the initial password is the register number, so guessing is throttled.
app.security.login-max-failures=${APP_LOGIN_MAX_FAILURES:5}
app.security.login-lockout-minutes=${APP_LOGIN_LOCKOUT_MINUTES:15}

# --- Reminder (in-app + email) to students whose profile is incomplete. Daily at 10:00, at most once a week each.
app.profile-reminder.enabled=${APP_PROFILE_REMINDER_ENABLED:true}
app.profile-reminder.interval-days=${APP_PROFILE_REMINDER_INTERVAL_DAYS:7}
app.profile-reminder.cron=${APP_PROFILE_REMINDER_CRON:0 0 10 * * *}

app.jwt.secret=${JWT_SECRET:ZGVmYXVsdC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LW5vdC1mb3ItcHJvZHVjdGlvbi11c2U=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ============================================================
# Logging Configuration
# ============================================================
logging.level.com.gces.placementcell=${LOGGING_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}

# ============================================================
# Admin Bootstrap Configuration & Data Initialization
# ============================================================
app.admin.default-email=${DEFAULT_ADMIN_EMAIL:admin@gces.edu}
app.admin.default-password=${DEFAULT_ADMIN_PASSWORD:Admin@1234}
app.admin.default-name=${DEFAULT_ADMIN_NAME:Placement Officer}
# Demo jobs and students: OFF unless explicitly enabled (local demos only, never on a real database).
app.data-init.enabled=${APP_DATA_INIT_ENABLED:false}
# Creates the first admin only when the database has none.
app.admin-init.enabled=${APP_ADMIN_INIT_ENABLED:true}
