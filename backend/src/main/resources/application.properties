# ============================================================
# Application Configuration — Placement Cell Backend
# ============================================================
spring.application.name=placement-cell

# ============================================================
# Database Configuration — Neon PostgreSQL
# Loaded from .env (DB_URL, DB_USERNAME, DB_PASSWORD)
# ============================================================
spring.datasource.url=${DB_URL:${DATABASE_URL:}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA & Hibernate Settings
# Only establish connection - NO DDL or automatic modifications
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# Enable automatic SQL schema initialization from schema.sql
# ============================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql


# ============================================================
# Server Configuration
# ============================================================
server.port=8080
server.servlet.context-path=/api

# ============================================================
# Actuator Endpoints
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================================
# Jackson JSON Settings
# ============================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================================
# Logging Configuration
# ============================================================
logging.level.com.gces.placementcell=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
