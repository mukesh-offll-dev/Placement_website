# ============================================================
# Application Configuration — Placement Cell Backend
# ============================================================
spring.application.name=placement-cell

# ============================================================
# Database Configuration — Neon PostgreSQL
# Loaded from .env
# ============================================================
spring.datasource.url=${DB_URL:${DATABASE_URL:}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA & Hibernate Settings
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# SQL Schema Initialization
# ============================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ============================================================
# Server Configuration
# ============================================================
server.port=8080
server.servlet.context-path=/api

# ============================================================
# Multipart File Upload Configuration
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ============================================================
# File Upload Configuration
# ============================================================
file.upload-dir=./uploads
file.resume-subdir=resumes
file.project-media-subdir=projects
file.max-resume-size=10485760
file.max-media-size=10485760

# ============================================================
# Actuator Endpoints
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================================
# Jackson JSON Settings
# ============================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================================
# Logging Configuration
# ============================================================
logging.level.com.gces.placementcell=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# ============================================================
# JWT Configuration
# Loaded from .env (JWT_SECRET, JWT_EXPIRATION_MS)
# ============================================================
app.jwt.secret=${JWT_SECRET:ZGVmYXVsdC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LW5vdC1mb3ItcHJvZHVjdGlvbi11c2U=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ============================================================
# Admin Bootstrap Configuration
# ============================================================
app.admin.default-email=${DEFAULT_ADMIN_EMAIL:admin@gces.edu}
app.admin.default-password=${DEFAULT_ADMIN_PASSWORD:Admin@1234}
app.admin.default-name=${DEFAULT_ADMIN_NAME:Placement Officer}
