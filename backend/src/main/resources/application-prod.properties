# ============================================================
# Production Profile Configuration — Placement Cell Backend
# Active when SPRING_PROFILES_ACTIVE=prod
# ============================================================

# ============================================================
# Server Configuration
# ============================================================
server.port=${SERVER_PORT:${PORT:8080}}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api}

# ============================================================
# Database Configuration — PostgreSQL Production
# Enforces real database credentials via environment (no in-memory fallback)
# ============================================================
spring.datasource.url=${DB_URL:${DATABASE_URL}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:600000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}

# ============================================================
# JPA & Hibernate Settings
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Strictly disable H2 console in production
spring.h2.console.enabled=false

# ============================================================
# SQL Schema Initialization (schema.sql uses CREATE TABLE IF NOT EXISTS)
# ============================================================
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql

# ============================================================
# CORS Configuration
# Must be explicitly configured to allowed frontend production origin(s)
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ============================================================
# File Storage Configuration
# ============================================================
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# ============================================================
# JWT Security Configuration
# JWT_SECRET must be supplied via environment variable in production
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ============================================================
# Data Bootstrap Configuration
# Disable dummy demo student/job creation in production
# ============================================================
app.data-init.enabled=${APP_DATA_INIT_ENABLED:false}

# ============================================================
# Logging Configuration
# Clean production logging (no verbose DEBUG output leaking data)
# ============================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.gces.placementcell=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:WARN}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}

# ============================================================
# Actuator Security Configuration
# Hide sensitive internal health details in production
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
