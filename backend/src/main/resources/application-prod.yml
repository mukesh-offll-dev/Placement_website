# ============================================================
# PROD PROFILE — PostgreSQL
# Set these environment variables before switching to this profile:
#
#   DB_URL      — e.g. jdbc:postgresql://localhost:5432/placement_cell
#   DB_USERNAME — your postgres username
#   DB_PASSWORD — your postgres password
#   JWT_SECRET  — a random 256-bit base64 string (for JWT, added later)
#
# Switch active profile: set SPRING_PROFILES_ACTIVE=prod
# ============================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non-contextual-creation: true

logging:
  level:
    com.gces.placementcell: INFO
    org.springframework.security: WARN
