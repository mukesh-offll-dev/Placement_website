server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: placement-cell

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 20MB

  jpa:
    open-in-view: false

  # Jackson global settings
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

file:
  upload-dir: ./uploads
  resume-subdir: resumes
  project-media-subdir: projects
  max-resume-size: 10485760
  max-media-size: 10485760

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gces.placementcell: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

