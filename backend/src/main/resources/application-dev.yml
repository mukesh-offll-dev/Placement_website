# ============================================================
# DEV PROFILE — H2 in-memory database
# No PostgreSQL credentials needed. App starts immediately.
# Switch to 'prod' profile when you have your DB credentials.
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:placementcell_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # H2 console — accessible at http://localhost:8080/api/h2-console during dev
  h2:
    console:
      enabled: true
      path: /h2-console
# SQL and bind logging remain disabled to avoid exposing account data.

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
