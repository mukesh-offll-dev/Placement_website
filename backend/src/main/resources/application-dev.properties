# ============================================================
# Development Profile Configuration — Placement Cell Backend
# In-memory H2 Database in PostgreSQL mode (zero external setup needed)
# ============================================================
spring.datasource.url=jdbc:h2:mem:placementcelldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console accessible at /api/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false

# SQL Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
