# Render Blueprint: the Spring Boot backend. The frontend is deployed on Vercel (see vercel.json).
# Create it with Render > New > Blueprint and pick this repo. Secrets (sync: false) are asked for
# in the dashboard; they are never stored in git.
services:
  - type: web
    name: placement-cell-api
    runtime: docker
    region: singapore            # same region as the Neon database
    plan: starter                # the free plan sleeps after ~15 min idle and has too little RAM for Spring Boot
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_URL                # jdbc:postgresql://<neon-host>/neondb?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET            # 32+ random characters
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS   # your Vercel URL, e.g. https://placement-cell.vercel.app
        sync: false
      - key: APP_FRONTEND_URL           # same Vercel URL (used in email links)
        sync: false
      - key: APP_MAIL_ENABLED
        value: "true"
      - key: APP_MAIL_STUDENT_APPLICATION_EMAILS
        value: "true"
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: FILE_STORAGE          # uploads live in Cloudinary, so no disk is needed
        value: cloudinary
      - key: CLOUDINARY_URL        # cloudinary://<api_key>:<api_secret>@<cloud_name>
        sync: false
